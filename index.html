<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0305">
  <meta name="description" content="A little surprise, made with love.">
  <title>For You ❤️</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌹</text></svg>">

  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/stage1.css">
  <link rel="stylesheet" href="css/stage2.css">
  <link rel="stylesheet" href="css/stage3.css">
  <link rel="stylesheet" href="css/stage4.css">
</head>
<body>
  <div id="app" class="app">
    <main id="stages">
      <section class="stage" id="stage-1" data-stage="1" aria-label="For you" hidden></section>
      <section class="stage stage--scroll" id="stage-2" data-stage="2" aria-label="Our little story" hidden></section>
      <section class="stage" id="stage-3" data-stage="3" aria-label="Someone is coming" hidden></section>
      <section class="stage" id="stage-4" data-stage="4" aria-label="I choose you, always" hidden></section>
    </main>

    <div class="grain" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
    <div id="veil" class="veil" aria-hidden="true"></div>

    <div class="hud">
      <button id="sound-toggle" class="icon-btn" type="button" aria-label="Mute music" aria-pressed="false" hidden>
        <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
        <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></svg>
      </button>
    </div>

    <div id="loader" class="loader" role="status" aria-live="polite">
      <div class="loader__inner">
        <svg class="loader__heart" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.2 3 4.5 6.6 4.5c2.1 0 3.6 1.2 4.4 2.5.8-1.3 2.3-2.5 4.4-2.5 3.6 0 5.7 3.7 4.2 7.2C19.5 16.4 12 21 12 21z"/></svg>
        <div class="loader__text">Preparing something special…</div>
        <div class="loader__bar"><span id="loader-bar"></span></div>
      </div>
    </div>
  </div>

  <noscript><p style="padding:2rem;text-align:center">This little surprise needs JavaScript turned on ❤️</p></noscript>

  <script src="js/vendor/gsap.min.js"></script>
  <script src="js/vendor/ScrollTrigger.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/core.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/stage1.js"></script>
  <script src="js/stage2.js"></script>
  <script src="js/stage3.js"></script>
  <script src="js/stage4.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
